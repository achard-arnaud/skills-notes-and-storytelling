name: skill-qa
on:
  pull_request:
    branches: [dev, main, "claude/sleepy-archimedes-8novca"]
  push:
    branches: [dev, main, "claude/sleepy-archimedes-8novca"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_contracts.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/language_lint.py --self-test
      - run: python scripts/note_runtime.py validate examples/runtime-bundle.json
      - run: python scripts/context_audit.py examples/runtime-read-set.json --budget 2000
