name: Pedagogical render
on:
  pull_request:
    paths:
      - 'renderers/pedagogical/**'
      - 'learning/enterprise-ai/**'
      - 'skills/**'
      - 'contracts/pedagogical-render-binding.schema.json'
      - 'tests/test_pedagogical_renderer.py'
      - '.github/workflows/pedagogical-render.yml'
  push:
    branches: [dev, main]
    paths:
      - 'renderers/pedagogical/**'
      - 'learning/enterprise-ai/**'
      - 'skills/**'
      - 'contracts/pedagogical-render-binding.schema.json'
      - 'tests/test_pedagogical_renderer.py'
      - '.github/workflows/pedagogical-render.yml'
permissions:
  contents: read
jobs:
  render-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r renderers/pedagogical/requirements.txt
      - name: Reuse installed Chrome or provision Playwright Chromium
        shell: bash
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [[ -n "$browser_path" ]]; then
            echo "NICE_CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Test content, upstream integrity, tampering and overflow rejection
        env:
          PEDAGOGICAL_BROWSER_TEST: '1'
        run: python -m unittest discover -s tests -p test_pedagogical_renderer.py -v
      - name: Render all six modules on PR and dev
        if: github.ref != 'refs/heads/main'
        run: |
          python renderers/pedagogical/render.py learning/enterprise-ai --out /tmp/pedagogical-render
          for module in prediction perception creation reasoning agentic multicapability; do
            python renderers/pedagogical/verify.py "learning/enterprise-ai/$module.md" "/tmp/pedagogical-render/$module"
          done
      - name: Generate and verify Perception from main
        if: github.ref == 'refs/heads/main'
        run: |
          python renderers/pedagogical/render.py learning/enterprise-ai/perception.md --out /tmp/pedagogical-render
          python renderers/pedagogical/verify.py learning/enterprise-ai/perception.md /tmp/pedagogical-render/perception
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-ai-pedagogical-render
          path: /tmp/pedagogical-render
          if-no-files-found: warn
