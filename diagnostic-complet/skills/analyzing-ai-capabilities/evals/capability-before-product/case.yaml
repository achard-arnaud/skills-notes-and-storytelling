schema_version: "1.1"
name: capability-before-product
expected_outcome: |
  La réponse nomme les capacités mobilisées, conditionne la solution à la donnée et au workflow, exige validation humaine pour toute action sensible, présente les postures comme un portefeuille, et propose des side stories typées (par exemple un lexique VAC ou un focus FOC) avec problématique et ponts. Aucun gain n'est chiffré sans source.
