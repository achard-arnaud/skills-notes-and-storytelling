name: pick-type-and-pitch
expected_outcome: |
  Le type retenu est veille_corporate_perso [VCP], avec la raison pour laquelle comparator et analytical_focus ne conviennent pas. Le texte compte 10 à 15 lignes, au plus 32 mots chacune, trois à cinq faits datés et sourcés, une ligne de limite, une lecture personnelle signée et séparée, une implication qui nomme le passage. Le paquet de rendu contient problématique et ponts.
