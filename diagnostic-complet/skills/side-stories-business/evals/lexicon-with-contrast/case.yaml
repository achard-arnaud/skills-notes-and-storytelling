schema_version: "1.1"
name: lexicon-with-contrast
expected_outcome: |
  Le type retenu est veille_academique [VAC] avec 5 à 7 entrées. Chaque entrée a une définition sourcée avec niveau de preuve, un exemple, un en pratique qui cite le passage, un contre-point et une mise en perspective. Aucune source inventée ; les définitions non retrouvées sont marquées fournies.
