name: corporate-vs-industrial
expected_outcome: |
  Les deux premiers cas sont classés corporate et le troisième industriel, avec le motif. Aucun gain n'est présenté comme acquis ; les cas non confirmés restent candidats. L'illustration est une forme valide (cas d'usage, citation, objet ou personne) avec problématique et ponts.
